<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E1A0CF" />
      <stop offset="50%" stop-color="#F2C4CE" />
      <stop offset="100%" stop-color="#D95374" />
    </linearGradient>
    <linearGradient id="glass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#F4EDE3" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0277BD" />
      <stop offset="100%" stop-color="#00A896" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2C1E26" flood-opacity="0.25" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#D95374" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Shield with smooth rounded corners -->
  <rect x="32" y="32" width="448" height="448" rx="128" fill="url(#bg-grad)" filter="url(#shadow)" />
  
  <!-- Outer Pin / Compass Ring -->
  <circle cx="240" cy="215" r="120" fill="none" stroke="#2C1E26" stroke-width="26" opacity="0.12" />
  
  <!-- Central Glass Circle -->
  <circle cx="240" cy="215" r="105" fill="url(#glass-grad)" stroke="#2C1E26" stroke-width="24" filter="url(#glow)" />
  
  <!-- Central 'U' Search Arc -->
  <path d="M 190 175 V 220 A 50 50 0 0 0 290 220 V 175" fill="none" stroke="#2C1E26" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Found Sparkle / Location Pin Core -->
  <circle cx="240" cy="215" r="20" fill="url(#accent-grad)" />

  <!-- Magnifying Glass Handle -->
  <path d="M 315 290 L 395 370" fill="none" stroke="#2C1E26" stroke-width="32" stroke-linecap="round" />
</svg>
